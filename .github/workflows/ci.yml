name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: |-
            node_modules/.cache/turbo
          key: ${{ runner.os }}-${{ matrix.node-version }}-turbo-${{ hashFiles('turbo.json') }}

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps

      - name: Prisma generate
        run: pnpm exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Playwright tests
        run: pnpm --filter web test:e2e
        env:
          CI: true

      - name: Build
        run: pnpm build

      - name: Prisma schema diff
        run: pnpm exec prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script
