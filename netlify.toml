# Netlify configuration for Classroom Informatika
# Uses pnpm workspace and Prisma generation before building the Next.js app

[build]
  command = "bash -lc 'if [ -f ./scripts/netlify-build.sh ]; then bash ./scripts/netlify-build.sh; elif [ -f ../scripts/netlify-build.sh ]; then bash ../scripts/netlify-build.sh; else echo Missing netlify build script >&2; exit 1; fi'"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--version"

[functions]
  node_bundler = "esbuild"

[[plugins]]
  package = "@netlify/plugin-nextjs"
